<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宠物日记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17181c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>宠物日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181c;
    --panel:#1f2024;
    --charcoal:#2b2d33;
    --silver:#a7adb8;
    --silver-soft:#dde0e6;
    --pearl:#f5f3ee;
    --card:#ffffff;
    --line:#e6e2d8;
    --gold:#c8933f;
    --gold-soft:#f2ddb0;
    --ink-soft:rgba(23,24,28,.62);
    --ink-faint:rgba(23,24,28,.4);
    --danger:#b8503b;
    --good:#4c7a5e;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); overscroll-behavior-y:none;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }
  #app{
    width:100%; max-width:480px;
    min-height:100vh; min-height:100dvh;
    position:relative;
    display:flex; flex-direction:column;
    overflow-x:hidden;
  }
  .bg-mesh{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; height:100%;
    z-index:0; pointer-events:none; overflow:hidden;
    background-color:var(--pearl);
    background-image:
      radial-gradient(360px 360px at 14% 8%, rgba(242,221,176,.55), transparent 70%),
      radial-gradient(320px 320px at 92% 20%, rgba(221,224,230,.5), transparent 70%),
      radial-gradient(380px 380px at 96% 68%, rgba(200,147,63,.22), transparent 70%),
      radial-gradient(320px 320px at 4% 88%, rgba(58,61,68,.09), transparent 70%),
      radial-gradient(440px 440px at 50% 42%, rgba(221,224,230,.22), transparent 70%);
  }
  .bg-mesh::before{
    content:''; position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.6) 1px, transparent 1.6px);
    background-size: 46px 46px;
    opacity:.45;
    mix-blend-mode:overlay;
  }
  .bg-mesh::after{
    content:''; position:absolute; inset:0;
    opacity:.045; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #appContent{
    position:relative; z-index:1;
    flex:1; min-height:100%;
    display:flex; flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    padding:calc(var(--safe-top) + 14px) 18px 12px;
    background:linear-gradient(180deg, var(--pearl) 70%, rgba(245,243,238,0));
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .topbar.solid{ background:var(--pearl); border-bottom:1px solid var(--line); }
  .tb-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line);
    color:var(--ink); cursor:pointer; flex:none;
  }
  .tb-btn svg{width:18px; height:18px;}
  .tb-title{
    font-family:var(--font-display); font-weight:600; font-size:19px;
    letter-spacing:.2px; flex:1; text-align:center; color:var(--ink);
  }
  .tb-spacer{width:36px; flex:none;}

  /* ---------- Home ---------- */
  .home-header{
    padding:6px 20px 18px;
  }
  .tag-badge{
    width:78px; height:78px; border-radius:50%;
    margin:0 auto 12px;
    background:radial-gradient(circle at 32% 28%, #3a3d44, var(--ink) 72%);
    border:3px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(23,24,28,.25);
    position:relative; overflow:hidden;
  }
  .tag-badge.sm{ width:60px; height:60px; margin:0; border-width:2px; }
  .tag-badge.add{
    background:var(--card); border:2px dashed var(--line); color:var(--ink-faint);
    box-shadow:none;
  }
  .tag-badge img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .avatar-edit-badge{
    position:absolute; bottom:8px; right:calc(50% - 39px - 4px);
    width:24px; height:24px; border-radius:50%; background:var(--ink);
    border:2px solid var(--pearl); display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft); pointer-events:none;
  }
  .avatar-edit-badge svg{ width:12px; height:12px; }
  .tag-badge svg{width:38px; height:38px;}
  .tag-badge.sm svg{ width:28px; height:28px; }
  .pets-row{
    display:flex; align-items:flex-start; justify-content:center; flex-wrap:wrap;
    gap:16px; margin:4px 0 16px;
  }
  .pet-mini{ display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .pet-mini-name{
    font-size:11.5px; color:var(--ink-soft); margin-top:7px; max-width:72px;
    text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pet-name{
    font-family:var(--font-display); font-size:26px; font-weight:600;
    text-align:center; color:var(--ink); margin:0 0 2px; cursor:pointer;
  }
  .pet-sub{
    text-align:center; color:var(--ink-soft); font-size:13px; margin:0;
    letter-spacing:.3px; cursor:pointer;
  }
  .stat-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    margin:16px 0 4px;
  }
  .stat-chip{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px; text-align:center;
  }
  .stat-chip .v{ font-family:var(--font-mono); font-size:16px; font-weight:600; color:var(--ink);}
  .stat-chip .l{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; letter-spacing:.2px;}

  .reminder-strip{
    margin:14px 20px 0; padding:11px 14px;
    background:var(--ink); border-radius:14px;
    display:flex; align-items:center; gap:10px;
    color:var(--gold-soft); font-size:12.5px;
    cursor:pointer;
  }
  .reminder-strip svg{width:16px; height:16px; flex:none; color:var(--gold);}
  .reminder-strip b{color:#fff; font-weight:600;}
  .reminder-strip .chev-r{ margin-left:auto; color:var(--silver); width:14px; height:14px; flex:none; }

  /* ---------- Grouped list (home grid) ---------- */
  .group{ margin:22px 18px 0; }
  .group-label{
    font-size:11.5px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink-faint); margin:0 10px 8px;
  }
  .group-card{
    background:var(--card); border-radius:16px; overflow:hidden;
    border:1px solid var(--line);
  }
  .mod-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .mod-row:last-child{ border-bottom:none; }
  .mod-row:active{ background:#faf8f3; }
  .mod-icon{
    width:34px; height:34px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--pearl); color:var(--charcoal);
  }
  .mod-icon svg{ width:18px; height:18px; }
  .mod-text{ flex:1; min-width:0; }
  .mod-text .t{ font-size:15px; font-weight:600; color:var(--ink); }
  .mod-text .d{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .mod-count{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-faint);
    background:var(--pearl); border-radius:8px; padding:3px 7px; flex:none;
  }
  .chev{ width:15px; height:15px; color:var(--ink-faint); flex:none; }

  .bottom-pad{ height:40px; }

  /* ---------- Detail view ---------- */
  .detail-body{ padding:4px 18px 20px; flex:1; }
  .summary-card{
    background:var(--ink); color:var(--pearl); border-radius:18px;
    padding:18px; margin:6px 0 18px;
  }
  .summary-card .big{
    font-family:var(--font-mono); font-size:30px; font-weight:600; color:#fff;
  }
  .summary-card .unit{ font-size:14px; color:var(--silver); margin-left:4px; }
  .summary-card .cap{ font-size:11.5px; color:var(--silver); letter-spacing:.3px; margin-top:2px;}
  .delta{ font-size:12.5px; margin-top:8px; display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; }
  .delta.up{ background:rgba(184,80,59,.18); color:#e19c8c; }
  .delta.down{ background:rgba(76,122,94,.2); color:#9bd1b3; }
  .delta.flat{ background:rgba(167,173,184,.18); color:var(--silver-soft); }
  .chart-wrap{ margin-top:14px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12.5px; }
  .bar-row .bl{ width:64px; flex:none; color:var(--silver); }
  .bar-track{ flex:1; height:7px; border-radius:5px; background:rgba(255,255,255,.12); overflow:hidden;}
  .bar-fill{ height:100%; background:var(--gold); border-radius:5px; }
  .bar-row .bv{ width:56px; flex:none; text-align:right; font-family:var(--font-mono); color:#fff; }

  .entry-card{
    background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer;
    display:flex; justify-content:space-between; gap:10px;
  }
  .entry-card:active{ background:#faf8f3; }
  .entry-main .t{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .entry-main .s{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .entry-side{ flex:none; text-align:right; }
  .entry-side .d{ font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); }
  .entry-side .tag{
    display:inline-block; margin-top:5px; font-size:10.5px; padding:2px 8px;
    border-radius:20px; background:var(--pearl); color:var(--charcoal); font-weight:600;
  }

  .empty-state{
    text-align:center; padding:50px 20px 30px; color:var(--ink-faint);
  }
  .empty-state svg{ width:44px; height:44px; margin-bottom:12px; color:var(--silver); }
  .empty-state p{ font-size:13.5px; margin:0; line-height:1.7; }
  .empty-state b{ color:var(--ink-soft); }

  .fab{
    position:fixed; right:calc(50% - 240px + 20px); bottom:calc(24px + var(--safe-bottom));
    width:54px; height:54px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    box-shadow:0 10px 24px rgba(23,24,28,.35); z-index:25;
  }
  .fab svg{ width:24px; height:24px; }
  @media (max-width:520px){ .fab{ right:20px; } }

  /* ---------- Sheet / modal ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(23,24,28,.45);
    z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px; background:var(--pearl);
    border-radius:22px 22px 0 0; padding:14px 20px calc(24px + var(--safe-bottom));
    max-height:88vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet-grip{ width:36px; height:4px; background:var(--line); border-radius:3px; margin:2px auto 14px; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-title{ font-family:var(--font-display); font-size:19px; font-weight:600; }
  .sheet-close{ font-size:13.5px; color:var(--ink-soft); cursor:pointer; padding:4px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.2px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px;
    padding:11px 13px; font-size:14.5px; font-family:var(--font-body); color:var(--ink);
    appearance:none; -webkit-appearance:none;
  }
  .field textarea{ min-height:70px; resize:vertical; line-height:1.5; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--gold-soft); border-color:var(--gold); }

  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:13px; border-radius:13px; border:none; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:var(--font-body);
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:active{ background:#000; }
  .btn-ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn-danger{ background:rgba(184,80,59,.12); color:var(--danger); border:1px solid rgba(184,80,59,.3); }

  .detail-sheet-body p{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 4px; }
  .detail-sheet-body .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .detail-sheet-body .row:last-of-type{ border-bottom:none; }
  .detail-sheet-body .row .k{ color:var(--ink-faint); }
  .detail-sheet-body .row .v{ color:var(--ink); font-weight:600; text-align:right; max-width:65%; }

  .toast{
    position:fixed; left:50%; bottom:calc(30px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:80; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app"><div class="bg-mesh"></div><div id="appContent"></div></div>
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importInput" accept="application/json" style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<script>
/* ================= Icons ================= */
const ICONS = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`,
  paw: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="9" r="2.2"/><circle cx="11" cy="6" r="2.2"/><circle cx="16.5" cy="7" r="2.2"/><circle cx="20" cy="11.5" r="2.1"/><path d="M12 12c-3.3 0-6.4 2.6-6.4 5.4 0 1.8 1.5 2.9 3.2 2.4 1.1-.3 2.1-.9 3.2-.9s2.1.6 3.2.9c1.7.5 3.2-.6 3.2-2.4 0-2.8-3.1-5.4-6.4-5.4z"/></svg>`,

  scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 5V3M9 3h6"/><path d="M12 13l3-4"/></svg>`,
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1"/></svg>`,
  book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0 5-8.8 10.4-8.8 10.4S3.2 13.6 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9z"/><path d="M9 9.5l1.4 2 2.2-3.2"/></svg>`,
  clipboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>`,

  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>`,
  potty: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="10" rx="2.5"/><path d="M3.5 9c0-3.3 2.3-5.5 5.5-5.5h6c3.2 0 5.5 2.2 5.5 5.5"/><path d="M9 14.2h.01M15 14.2h.01"/></svg>`,
};

/* ================= Storage helpers (本地 localStorage，无需登录) ================= */
const STORAGE_PREFIX = 'schnauzer-diary:';
async function loadArr(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    if(!raw) return [];
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
async function saveArr(key, arr){
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(arr)); }catch(e){ console.error('save failed', key, e); showToast('保存失败，存储空间可能已满'); }
}
async function loadObj(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
async function saveObj(key, obj){
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(obj)); }catch(e){ console.error('save failed', key, e); showToast('保存失败，可能是头像图片太大'); }
}

/* ================= Date helpers ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d)) return s;
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDateTime(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d)) return s;
  return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateFull(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d)) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function daysSince(s){
  if(!s) return null;
  const d = new Date(s); if(isNaN(d)) return null;
  const diff = Math.floor((Date.now()-d.getTime())/86400000);
  return diff;
}
function computeAge(birthday){
  if(!birthday) return '';
  const b = new Date(birthday+'T00:00:00');
  if(isNaN(b)) return '';
  const now = new Date();
  if(b > now) return '';
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  let days = now.getDate() - b.getDate();
  if(days < 0){
    months -= 1;
    const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months < 0){
    years -= 1;
    months += 12;
  }
  const parts = [];
  if(years>0) parts.push(years+'岁');
  if(months>0 || years>0) parts.push(months+'个月');
  parts.push(days+'天');
  return parts.join('');
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(16).slice(2)); }

/* ================= App state ================= */
const state = {
  view:'home',            // 'home' | moduleKey
  data:{},                 // moduleKey -> array
  pets:[],                 // {id,name,species,breed,avatar}
  settings:{appTitle:'', species:null},
  editingEntry:null,
};

function petById(id){ return state.pets.find(p=>p.id===id); }

function getFields(key){
  const cfg = MODULES[key];
  if(PET_SCOPED.includes(key) && state.pets.length>1){
    return [{key:'petId', label:'宠物', type:'petselect', required:true}, ...cfg.fields];
  }
  return cfg.fields;
}

async function loadModuleData(){
  for(const key of Object.keys(MODULES)){
    state.data[key] = await loadArr(key);
  }
}

async function initData(){
  state.settings = await loadObj('settings', {appTitle:'', species:null});

  let pets = await loadObj('pets', null);
  if(!pets){
    // migrate from the old single-pet "profile" key if present
    const oldProfile = await loadObj('profile', null);
    if(oldProfile && (oldProfile.name || oldProfile.avatar)){
      pets = [{id:uid(), name:oldProfile.name||'', species:'dog', breed:'', avatar:oldProfile.avatar||''}];
      if(!state.settings.species){
        state.settings.species = 'dog'; // existing users already have dog-oriented data
        await saveObj('settings', state.settings);
      }
    }else{
      pets = [];
    }
    await saveObj('pets', pets);
  }
  state.pets = pets;

  buildModules(); // safe default fallback ('dog') used for initial key set if species unset yet
  await loadModuleData();
}

function sortedEntries(key){
  const cfg = MODULES[key];
  const arr = [...state.data[key]];
  arr.sort((a,b)=> new Date(b[cfg.dateField]||0) - new Date(a[cfg.dateField]||0));
  return arr;
}

/* ================= Rendering ================= */
const app = document.getElementById('appContent');

function render(){
  document.title = state.settings.appTitle || '宠物日记';
  if(state.view === 'home') renderHome();
  else renderDetail(state.view);
}

function renderHome(){
  const feeding = sortedEntries('feeding');
  const walk = sortedEntries(ACTIVITY_KEY);
  const weight = sortedEntries('weight');

  const todayFeeds = feeding.filter(e => (e.datetime||'').slice(0,10) === todayStr()).length;
  const lastWalkDays = walk.length ? daysSince(walk[0].datetime) : null;
  const latestWeight = weight.length ? weight[0].weight : null;

  // reminders: only the most recent entry per (pet, type) counts — an older
  // entry's nextDate is considered superseded once a newer entry of the same
  // type has been logged (e.g. 第二针 supersedes 第一针's "next shot" reminder).
  const latestByGroup = {};
  state.data.health.forEach(e=>{
    const gKey = (e.petId||'') + '|' + (e.type||'');
    const cur = latestByGroup[gKey];
    if(!cur || new Date(e.date||0) >= new Date(cur.date||0)){
      latestByGroup[gKey] = e;
    }
  });
  const reminders = [];
  Object.values(latestByGroup).forEach(e=>{
    if(e.nextDate && e.reminderStatus!=='done'){
      const d = daysSince(e.nextDate);
      if(d !== null && d > -15){
        const pet = state.pets.length>1 ? petById(e.petId) : null;
        reminders.push({item:e.item||e.type, date:e.nextDate, overdue: d>=0, petName: pet? pet.name : '', entryId:e.id});
      }
    }
  });
  reminders.sort((a,b)=> new Date(a.date) - new Date(b.date));
  const topReminder = reminders.find(r=>true);

  // header: avatar area
  let headerHtml = '';
  if(state.pets.length<=1){
    const pet = state.pets[0] || null;
    const avatarInner = pet && pet.avatar
      ? `<img src="${pet.avatar}" alt="头像">`
      : ICONS.paw.replace('currentColor','var(--gold-soft)');
    const showCam = !(pet && pet.avatar);
    const editArg = pet ? `'${pet.id}'` : 'null';
    const ageText = pet && pet.birthday ? computeAge(pet.birthday) : '';
    headerHtml = `
      <div class="tag-badge" onclick="openPetEdit(${editArg})">
        ${avatarInner}
        ${showCam? `<div class="avatar-edit-badge">${ICONS.camera}</div>`:''}
      </div>
      <p class="pet-name" onclick="openPetEdit(${editArg})">${pet && pet.name ? escapeHtml(pet.name) : '<span style="color:var(--ink-faint)">宠物昵称</span>'}</p>
      <p class="pet-sub" onclick="openPetEdit(${editArg})">${pet && pet.breed ? escapeHtml(pet.breed) : '<span style="color:var(--ink-faint)">点击填写品种 / 简介</span>'}</p>
      ${ageText? `<div style="text-align:center; margin-top:7px;"><span style="display:inline-block; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:4px 13px;">${escapeHtml(ageText)}</span></div>` : ''}
    `;
  }else{
    const cards = state.pets.map(p=>{
      const inner = p.avatar ? `<img src="${p.avatar}" alt="头像">` : ICONS.paw.replace('currentColor','var(--gold-soft)');
      return `
        <div class="pet-mini" onclick="openPetEdit('${p.id}')">
          <div class="tag-badge sm">${inner}</div>
          <div class="pet-mini-name">${escapeHtml(p.name||'未命名')}</div>
        </div>
      `;
    }).join('');
    headerHtml = `
      <div class="pets-row">
        ${cards}
        <div class="pet-mini" onclick="openPetEdit(null)">
          <div class="tag-badge sm add">${ICONS.plus}</div>
          <div class="pet-mini-name">添加</div>
        </div>
      </div>
    `;
  }

  const thirdStat = state.pets.length<=1
    ? {v: latestWeight? latestWeight : '—', l:'体重 kg'}
    : {v: state.pets.length, l:'家庭宠物'};

  let html = `
    <div class="topbar">
      <a class="tb-btn" href="findmy://items" style="text-decoration:none; color:inherit;" title="打开查找App">${ICONS.pin}</a>
      <div class="tb-title" onclick="openTitleEdit()">${escapeHtml(state.settings.appTitle || '宠物日记')}</div>
      <div class="tb-btn" onclick="openBackupSheet()">${ICONS.cloud}</div>
    </div>
    <div class="home-header">
      ${headerHtml}
      <div class="stat-row">
        <div class="stat-chip"><div class="v">${todayFeeds}</div><div class="l">今日喂食</div></div>
        <div class="stat-chip"><div class="v">${lastWalkDays===null? '—' : (lastWalkDays===0? '今天':lastWalkDays+'天前')}</div><div class="l">最近运动</div></div>
        <div class="stat-chip"><div class="v">${thirdStat.v}</div><div class="l">${thirdStat.l}</div></div>
      </div>
    </div>
  `;

  if(topReminder){
    html += `
      <div class="reminder-strip" onclick="openReminderAction('${topReminder.entryId}')">
        ${ICONS.bell}
        <div>${topReminder.overdue?'已到期提醒':'即将提醒'}：<b>${topReminder.petName? escapeHtml(topReminder.petName)+' · ':''}${escapeHtml(topReminder.item)}</b> · ${fmtDateFull(topReminder.date)}</div>
        <div class="chev-r">${ICONS.chev}</div>
      </div>
    `;
  }

  GROUP_ORDER.forEach(group=>{
    const keys = Object.keys(MODULES).filter(k=>MODULES[k].group===group);
    if(!keys.length) return;
    html += `<div class="group"><div class="group-label">${group}</div><div class="group-card">`;

      const cfg = MODULES[k];
      const count = state.data[k].length;
      html += `
        <div class="mod-row" onclick="goTo('${k}')">
          <div class="mod-icon">${cfg.icon}</div>

        </div>

    });
    html += `</div></div>`;
  });

  html += `<div class="bottom-pad"></div>`;
  app.innerHTML = html;
}

          </div>
          <div class="entry-side">
            <div class="d">${tag}</div>
            ${cfg.pill? `<div class="tag">${escapeHtml(cfg.pill(e))}</div>` : ''}
            ${doneTag? `<div class="tag" style="margin-top:4px; background:rgba(76,122,94,.15); color:var(--good);">已完成</div>` : ''}
            ${petTag? `<div class="tag" style="margin-top:4px;">${escapeHtml(petTag)}</div>` : ''}
          </div>
        </div>
      `;
    });
  }

  html += `</div><button class="fab" onclick="openForm('${key}')">${ICONS.plus}</button>`;
  app.innerHTML = html;
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- Weight summary ---- */
function renderWeightSummary(entries){
  if(!entries.length) return '';
  const asc = [...entries].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const latest = parseFloat(asc[asc.length-1].weight);
  const prev = asc.length>1 ? parseFloat(asc[asc.length-2].weight) : null;
  let deltaHtml = '';
  if(prev !== null && !isNaN(latest) && !isNaN(prev)){
    const diff = +(latest-prev).toFixed(2);
    const cls = diff>0?'up':diff<0?'down':'flat';
    const sign = diff>0?'+':'';
    deltaHtml = `<span class="delta ${cls}">${sign}${diff} kg 较上次</span>`;
  }
  // build sparkline
  const vals = asc.map(e=>parseFloat(e.weight)).filter(v=>!isNaN(v));
  let svg = '';
  if(vals.length>1){
    const w=300,h=90,pad=8;
    const min=Math.min(...vals), max=Math.max(...vals);
    const range = (max-min)||1;
    const pts = vals.map((v,i)=>{
      const x = pad + (i*(w-pad*2)/(vals.length-1));
      const y = h-pad - ((v-min)/range)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const dots = vals.map((v,i)=>{
      const x = pad + (i*(w-pad*2)/(vals.length-1));
      const y = h-pad - ((v-min)/range)*(h-pad*2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#c8933f"/>`;
    }).join('');
    svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;margin-top:6px;">
      <polyline points="${pts.join(' ')}" fill="none" stroke="#c8933f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  }
  return `
    <div class="summary-card">
      <div><span class="big">${isNaN(latest)?'—':latest}</span><span class="unit">kg</span></div>
      <div class="cap">当前体重 · 共 ${entries.length} 条记录</div>
      ${deltaHtml}
      <div class="chart-wrap">${svg}</div>
    </div>
  `;
}

/* ---- Expense summary ---- */
function renderExpenseSummary(entries){
  if(!entries.length) return '';
  const now = new Date();
  const ym = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const monthEntries = entries.filter(e=> (e.date||'').slice(0,7)===ym);
  const monthTotal = monthEntries.reduce((s,e)=> s+ (parseFloat(e.amount)||0), 0);
  const totalsByCat = {};
  entries.forEach(e=>{
    const c = e.category||'其他';
    totalsByCat[c] = (totalsByCat[c]||0) + (parseFloat(e.amount)||0);
  });
  const maxVal = Math.max(...Object.values(totalsByCat), 1);
  const cats = Object.entries(totalsByCat).sort((a,b)=>b[1]-a[1]);
  let bars = cats.map(([cat,val])=>`
    <div class="bar-row">
      <div class="bl">${escapeHtml(cat)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(val/maxVal*100).toFixed(0)}%"></div></div>
      <div class="bv">¥${val.toFixed(0)}</div>
    </div>
  `).join('');
  return `
    <div class="summary-card">
      <div><span class="big">¥${monthTotal.toFixed(0)}</span></div>
      <div class="cap">本月支出 · 累计 ¥${entries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0).toFixed(0)}</div>
      <div class="chart-wrap">${bars}</div>
    </div>
  `;
}

/* ---- Health summary ---- */
function renderHealthSummary(entries){
  const withNext = entries.filter(e=>e.nextDate).sort((a,b)=> new Date(a.nextDate)-new Date(b.nextDate));
  if(!withNext.length) return '';
  const rows = withNext.slice(0,4).map(e=>{
    const d = daysSince(e.nextDate);
    const overdue = d!==null && d>=0;
    return `<div class="bar-row" style="align-items:center;">
      <div class="bl" style="width:auto;flex:1;color:${overdue?'#e19c8c':'var(--silver)'}">${escapeHtml(e.item||e.type)}</div>
      <div class="bv" style="width:auto;color:#fff;">${fmtDate(e.nextDate)}</div>
    </div>`;
  }).join('');
  return `
    <div class="summary-card">
      <div class="cap" style="margin-top:0;">提醒事项</div>
      <div class="chart-wrap">${rows}</div>
    </div>
  `;
}

function saveEntry(key, id=null){
  const fields = getFields(key);
  const obj = id ? {...state.data[key].find(e=>e.id===id)} : {id: uid()};
  let missingRequired = false;
  fields.forEach(f=>{
    const el = document.getElementById('f_'+f.key);
    const v = el ? el.value.trim() : '';
    if(f.required && !v) missingRequired = true;
    obj[f.key] = v;
  });
  if(missingRequired){ showToast('请填写必填项'); return; }
  if(PET_SCOPED.includes(key) && state.pets.length<=1){
    obj.petId = state.pets[0] ? state.pets[0].id : '';
  }
  if(id){
    const idx = state.data[key].findIndex(e=>e.id===id);
    state.data[key][idx] = obj;
  }else{
    state.data[key].push(obj);
  }
  saveArr(key, state.data[key]);
  closeSheet();
  render();
  showToast(id? '已更新':'已保存');
}

function resizeImageFile(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('avatarInput').addEventListener('change', async function(e){

    const wrap = document.getElementById('avatarPreviewWrap');
    if(wrap){

    }

  e.target.value = '';
});

  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${state.settings.appTitle||'宠物日记'}备份.json`;
  document.body.appendChild(a);

document.getElementById('importInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    try{
      const payload = JSON.parse(evt.target.result);
      if(!payload || typeof payload.data !== 'object') throw new Error('格式不正确');
      for(const key of Object.keys(MODULES)){
        if(Array.isArray(payload.data[key])){
          state.data[key] = payload.data[key];
          await saveArr(key, state.data[key]);
        }
      }
      if(Array.isArray(payload.pets)){
        state.pets = payload.pets;
        await saveObj('pets', state.pets);
      }else if(payload.profile){
        // backward compatibility with older single-pet backups
        state.pets = [{id:uid(), name:payload.profile.name||'', species:'dog', breed:'', avatar:payload.profile.avatar||''}];
        await saveObj('pets', state.pets);
      }
      if(payload.settings){
        state.settings = payload.settings;
        await saveObj('settings', state.settings);
      }
      closeSheet();
      goHome();
      showToast('导入成功');
    }catch(err){
      showToast('导入失败，文件格式不正确');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ---- Toast ---- */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1600);
}

/* ================= Onboarding (first run: choose dog / cat household) ================= */
function showOnboarding(){
  app.innerHTML = `
    <div style="min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 30px; text-align:center;">
      <div class="tag-badge" style="margin-bottom:22px;">${ICONS.paw.replace('currentColor','var(--gold-soft)')}</div>
      <h1 style="font-family:var(--font-display); font-size:23px; font-weight:600; margin:0 0 10px; color:var(--ink);">家里养的是？</h1>
      <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 28px; line-height:1.7; max-width:280px;">选择后会显示对应的日常记录内容，之后仍可以在设置里切换</p>
      <div style="display:flex; gap:14px; width:100%; max-width:300px;">
        <button class="btn btn-primary" style="flex:1; padding:22px 0; font-size:15px;" onclick="chooseSpecies('dog')">🐶<br><span>养狗</span></button>
        <button class="btn btn-primary" style="flex:1; padding:22px 0; font-size:15px;" onclick="chooseSpecies('cat')">🐱<br><span>养猫</span></button>
      </div>
    </div>
  `;
}

async function chooseSpecies(species){
  state.settings.species = species;
  await saveObj('settings', state.settings);
  buildModules();
  await loadModuleData();
  render();
}

function switchSpecies(sp){
  const msg = sp==='cat'
    ? '切换为猫咪模式后，将显示"玩耍/互动"和"如厕记录"。原有遛狗记录不会被删除，只是暂时不显示，切回狗狗模式还能看到。'
    : '切换为狗狗模式后，将显示"遛狗/运动"。原有猫咪相关记录不会被删除，只是暂时不显示，切回猫咪模式还能看到。';
  openConfirmSheet(msg, async ()=>{
    state.settings.species = sp;
    await saveObj('settings', state.settings);
    buildModules();
    await loadModuleData();
    closeSheet();
    goHome();
    showToast('已切换');
  }, '确定切换');
}

/* ================= Boot ================= */
(async function boot(){
  app.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--ink-faint);font-size:13px;">加载中…</div>`;
  try{
    await initData();
    if(!state.settings.species){
      showOnboarding();
    }else{
      render();
    }
  }catch(err){
    console.error('boot failed', err);
    app.innerHTML = `
      <div style="padding:80px 30px;text-align:center;">
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;line-height:1.7;">加载时出了点问题，试试重新打开一下</p>
        <button class="btn btn-primary" style="max-width:160px;margin:0 auto;padding:11px 20px;" onclick="location.reload()">重新加载</button>
      </div>
    `;
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
